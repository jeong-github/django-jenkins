<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chan Instagram</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    body {
      background-color: #fafafa;
    }
    .navbar {
      border-bottom: 1px solid #dbdbdb;
      background-color: white;
    }
    .post-card {
      background: white;
      border: 1px solid #dbdbdb;
      border-radius: 5px;
      margin-bottom: 20px;
      padding: 15px;
    }
    .post-content {
      font-size: 14px;
    }
    .post-date {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <img style="height: 30px; object-fit: contain"
           src="https://www.instagram.com/static/images/web/mobile_nav_type_logo-2x.png/1b47f9d0e595.png">
      <input class="form-control ms-3 me-3" style="width: 200px" type="search" placeholder="Search" aria-label="Search">
      <div>
        <span class="material-icons">home</span>
        <span class="material-icons">send</span>
        <span class="material-symbols-outlined">add_box</span>
        <span class="material-symbols-outlined">explore</span>
        <span class="material-symbols-outlined">favorite</span>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <h3>Recent Posts</h3>

    {% if posts %}
      {% for post in posts %}
        <div class="post-card">
          <div class="post-content">{{ post.content }}</div>
          <div class="post-date">Posted on: {{ post.created_at|date:"M d, Y, H:i" }}</div>
        </div>
      {% endfor %}
    {% else %}
      <p>No posts available.</p>
    {% endif %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
